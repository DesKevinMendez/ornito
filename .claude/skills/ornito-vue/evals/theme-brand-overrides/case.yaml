schema_version: "1.1"
name: theme-brand-overrides
expected_outcome: |
  resources/css/app.css imports tailwindcss and ornito/theme.css, adds an @source
  for node_modules/ornito/dist and the .dark custom variant, loads Inter and sets
  --ds-font-family, sets the key colors --ds-color-primary: #16a34a and
  --ds-color-error: #c81e1e (not shade by shade), and sets only the -dark tokens
  --ds-color-sidebar-bg-dark, --ds-color-sidebar-tab-bg-active-dark and
  --ds-color-card-bg-dark on :root. resources/js/app.ts imports ornito/style.css,
  calls initTheme() before mounting and provides useRequestKey.
