schema_version: "1.1"
name: install-guide
expected_outcome: |
  INSTALL_ORNITO.md installs ornito from the GitHub repo DesKevinMendez/ornito
  pinned to a release tag (e.g. #v0.12.0, not main), lists the peer dependencies
  (vue, vue-router, vee-validate, yup, @vueuse/core) and Tailwind v4, shows the CSS
  entry (tailwindcss, ornito/theme.css, @source node_modules/ornito/dist, dark
  variant), the app.ts setup (ornito/style.css, initTheme, provide useRequestKey),
  and the server-table contract: a request factory whose get returns { data } and a
  response { data, pagination } with page, per_page and filter[field] params.
