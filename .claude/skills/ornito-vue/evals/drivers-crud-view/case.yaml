schema_version: "1.1"
name: drivers-crud-view
expected_outcome: |
  DriversView.vue and DriverForm.vue are built from Ornito components: a ViewHeader
  with a create BaseButton (size auto) in #right, a server DataTable with url
  /api/v1/drivers, search-by as field names (not filter[...]), a status slot with
  Badge and an #actions slot with IconButtons, a Modal with the form, a
  ConfirmationModal for delete, useMessages().pushMessage feedback and a table
  refresh after saving or deleting. The form uses vee-validate Form with FormInput
  (id, name, label, v-model, yup rules) and SwitchInput. No invented props, no
  hardcoded or raw Tailwind colors.
